<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在线音乐编曲工作站 — 多轨步进音序器与编曲时间轴">
  <title>HarmonyForge · 编曲工作站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">◈</span>
        <h1>HarmonyForge</h1>
        <span class="brand-tag">编曲工作站</span>
      </div>
      <div class="transport">
        <button type="button" class="btn btn-icon" id="btnPlay" title="播放 (Space)" aria-label="播放">▶</button>
        <button type="button" class="btn btn-icon" id="btnStop" title="停止" aria-label="停止">■</button>
        <label class="control-inline">
          <span>BPM</span>
          <input type="range" id="bpm" min="60" max="180" value="120">
          <output id="bpmValue">120</output>
        </label>
        <label class="control-inline">
          <span>摇摆</span>
          <input type="range" id="swing" min="0" max="60" value="0">
          <output id="swingValue">0%</output>
        </label>
      </div>
      <div class="header-actions">
        <label class="control-inline">
          <span>调性</span>
          <select id="keySelect"></select>
        </label>
        <label class="control-inline">
          <span>音阶</span>
          <select id="scaleSelect">
            <option value="major">大调</option>
            <option value="minor">自然小调</option>
            <option value="pentatonic">五声音阶</option>
            <option value="dorian">多利亚</option>
          </select>
        </label>
        <button type="button" class="btn btn-ghost" id="btnSave">保存</button>
        <button type="button" class="btn btn-ghost" id="btnLoad">加载</button>
        <button type="button" class="btn btn-ghost" id="btnClear">清空</button>
      </div>
    </header>

    <main class="main">
      <section class="panel panel-arrange" aria-label="编曲时间轴">
        <div class="panel-head">
          <h2>编曲时间轴</h2>
          <p class="hint">点击格子选择段落使用的 Pattern，播放时将按顺序循环整首</p>
        </div>
        <div class="arrange-toolbar">
          <button type="button" class="btn btn-sm" id="btnAddSection">+ 增加段落</button>
          <span class="arrange-info" id="arrangeInfo">8 段 · 每段 1 小节</span>
        </div>
        <div class="arrange-timeline" id="arrangeTimeline"></div>
      </section>

      <section class="panel panel-patterns" aria-label="Pattern 选择">
        <div class="panel-head">
          <h2>Pattern 库</h2>
          <div class="pattern-tabs" id="patternTabs" role="tablist"></div>
        </div>
      </section>

      <section class="panel panel-sequencer" aria-label="步进音序器">
        <div class="panel-head">
          <h2>步进音序器</h2>
          <p class="hint">点击格子开关音符；旋律轨可点击选择音高</p>
        </div>
        <div class="sequencer-wrap">
          <div class="step-labels" id="stepLabels"></div>
          <div class="tracks" id="tracks"></div>
        </div>
      </section>

      <aside class="sidebar">
        <section class="panel panel-mixer">
          <h2>混音</h2>
          <div class="mixer-tracks" id="mixer"></div>
        </section>
        <section class="panel panel-help">
          <h2>快捷键</h2>
          <ul class="help-list">
            <li><kbd>Space</kbd> 播放 / 暂停</li>
            <li><kbd>1</kbd>–<kbd>4</kbd> 切换 Pattern</li>
            <li>点击旋律格设置音高</li>
          </ul>
        </section>
      </aside>
    </main>

    <footer class="footer">
      <span id="statusText">就绪 — 点击播放开始编曲预览</span>
      <span class="footer-credit">HarmonyForge · Web Audio 编曲</span>
    </footer>
  </div>

  <dialog id="noteDialog" class="note-dialog">
    <form method="dialog">
      <h3>选择音高</h3>
      <div class="note-grid" id="noteGrid"></div>
      <menu>
        <button type="submit" value="cancel" class="btn btn-ghost">取消</button>
        <button type="button" id="noteClear" class="btn btn-ghost">清除音符</button>
      </menu>
    </form>
  </dialog>

  <script src="js/audio-engine.js"></script>
  <script src="js/sequencer.js"></script>
  <script src="js/arranger.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
