name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          BUILD=$(date -u +%Y%m%d%H%M%S)
          printf '%s\n' "{\"version\":\"${VERSION}\",\"build\":\"${BUILD}\"}" > version.json
          sed -i 's/CURRENT = "[^"]*"/CURRENT = "'"${VERSION}"'"/' js/version.js
          sed -i 's/BUILD = "[^"]*"/BUILD = "'"${BUILD}"'"/' js/version.js
          mkdir -p _site
          cp index.html .nojekyll version.json _site/
          cp -r css js _site/
          sed -i "s|href=\"css/styles.css\"|href=\"css/styles.css?v=${BUILD}\"|" _site/index.html
          for f in app-logger.js version.js audio-engine.js sequencer.js arranger.js app.js; do
            sed -i "s|src=\"js/${f}\"|src=\"js/${f}?v=${BUILD}\"|" _site/index.html
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
