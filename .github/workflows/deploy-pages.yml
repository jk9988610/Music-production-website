name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          BUILD=$(date -u +%Y%m%d%H%M%S)
          printf '%s\n' "{\"version\":\"${VERSION}\",\"build\":\"${BUILD}\"}" > version.json
          sed -i 's/BUNDLED_VERSION = "[^"]*"/BUNDLED_VERSION = "'"${VERSION}"'"/' js/version.js
          sed -i 's/BUNDLED_BUILD = "[^"]*"/BUNDLED_BUILD = "'"${BUILD}"'"/' js/version.js
          mkdir -p _site
          cp index.html .nojekyll version.json _site/
          cp -r css js _site/
          sed -i "s|href=\"css/styles.css\"|href=\"css/styles.css?v=${BUILD}\"|" _site/index.html
          sed -i "s|href=\"css/layout.css\"|href=\"css/layout.css?v=${BUILD}\"|" _site/index.html
          sed -i "s|href=\"css/layout-spacing.css\"|href=\"css/layout-spacing.css?v=${BUILD}\"|" _site/index.html
          sed -i 's|<meta name="hf-app-version" content="[^"]*"|<meta name="hf-app-version" content="'"${VERSION}"'"|' _site/index.html
          sed -i 's|<meta name="hf-app-build" content="[^"]*"|<meta name="hf-app-build" content="'"${BUILD}"'"|' _site/index.html
          sed -i 's|class="app-version-value">[^<]*<|class="app-version-value">'"${VERSION}"'<|' _site/index.html
          for f in app-logger.js version.js instruments.js tone.min.js layout.js file-save.js project-io.js help-guide.js history.js audio-engine.js track-timing.js track-playback.js lame.min.js audio-export.js beat-battle-cloud.js sequencer.js arranger.js app.js; do
            sed -i "s|src=\"js/${f}\"|src=\"js/${f}?v=${BUILD}\"|" _site/index.html
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
